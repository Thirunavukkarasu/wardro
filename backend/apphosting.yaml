runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  - variable: FIREBASE_PROJECT_ID
    value: wardo-ce8d5
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_STORAGE_BUCKET
    value: wardo-ce8d5.firebasestorage.app
    availability:
      - RUNTIME
  - variable: CORS_ORIGINS
    value: https://wardro--wardo-ce8d5.us-east4.hosted.app
    availability:
      - RUNTIME

  # App Hosting reaches Cloud SQL through the Cloud SQL connector. To move to
  # any other Postgres, remove these four and set DATABASE_URL instead.
  - variable: CLOUD_SQL_CONNECTION_NAME
    value: wardo-ce8d5:asia-south1:wardo-ce8d5-2-instance
    availability:
      - RUNTIME
  - variable: DB_NAME
    value: wardo-ce8d5-2-database
    availability:
      - RUNTIME
  - variable: DB_USER
    value: wardro_app
    availability:
      - RUNTIME
  - variable: DB_PASSWORD
    secret: DATABASE_PASSWORD
    availability:
      - RUNTIME
