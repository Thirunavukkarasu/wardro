runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  - variable: FIREBASE_PROJECT_ID
    value: wardo-ce8d5
    availability:
      - BUILD
      - RUNTIME
  - variable: GCS_PHOTOS_BUCKET
    value: wardo-ce8d5-wardrobe-photos
    availability:
      - RUNTIME
  - variable: PHOTO_URL_SECRET
    secret: PHOTO_URL_SECRET
    availability:
      - RUNTIME
  - variable: CORS_ORIGINS
    value: https://wardro--wardo-ce8d5.us-east4.hosted.app
    availability:
      - RUNTIME

  # Neon Postgres. The connection string is the DATABASE_URL secret in Secret
  # Manager (same project); the App Hosting service account needs accessor on it.
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - RUNTIME
