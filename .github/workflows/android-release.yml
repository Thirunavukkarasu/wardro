name: Android release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Public build-time configuration. These are identifiers, not secrets —
      # they end up inside the APK — but they live in repository variables
      # rather than in the source tree. See mobile-rn/.env.example.
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_AGENT_URL: ${{ vars.EXPO_PUBLIC_AGENT_URL }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Verify public build variables
        run: |
          # EXPO_PUBLIC_* values are inlined by Metro at build time, so a
          # missing one fails silently in the app rather than here. Check up
          # front and name the variable in the error.
          missing=0
          for name in \
            EXPO_PUBLIC_API_URL \
            EXPO_PUBLIC_AGENT_URL \
            EXPO_PUBLIC_FIREBASE_API_KEY \
            EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN \
            EXPO_PUBLIC_FIREBASE_PROJECT_ID \
            EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            EXPO_PUBLIC_FIREBASE_APP_ID \
            EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID \
            EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository variable: $name (Settings -> Secrets and variables -> Actions -> Variables)"
              missing=1
            fi
          done
          exit $missing

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-rn/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: mobile-rn
        run: npm ci

      - name: Record build metadata
        run: |
          echo "EXPO_PUBLIC_BUILD_PROFILE=github-aab" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_GIT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Generate native Android project
        working-directory: mobile-rn
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Write SDK path
        working-directory: mobile-rn
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=${SDK_DIR}" > android/local.properties

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/wardro-upload.keystore
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Configure release signing
        working-directory: mobile-rn
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/wardro-upload.keystore
        run: node scripts/configure-android-signing.mjs

      - name: Build release bundle
        working-directory: mobile-rn
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/wardro-upload.keystore
          NODE_ENV: production
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: wardro-release-aab
          path: mobile-rn/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
