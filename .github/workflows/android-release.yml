name: Android release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://wardro-api-251900114942.asia-south1.run.app/api' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-rn/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: mobile-rn
        run: npm ci

      - name: Record build metadata
        run: |
          echo "EXPO_PUBLIC_BUILD_PROFILE=github-aab" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_GIT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Generate native Android project
        working-directory: mobile-rn
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Write SDK path
        working-directory: mobile-rn
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=${SDK_DIR}" > android/local.properties

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/wardro-upload.keystore
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Configure release signing
        working-directory: mobile-rn
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/wardro-upload.keystore
        run: node scripts/configure-android-signing.mjs

      - name: Build release bundle
        working-directory: mobile-rn
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/wardro-upload.keystore
          NODE_ENV: production
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: wardro-release-aab
          path: mobile-rn/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
